<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>bauflow — Unity Developer</title>
  <script>document.documentElement.setAttribute('data-theme', localStorage.getItem('theme') || 'dark');</script>
  <link rel="stylesheet" href="/assets/css/base/variables.css">
  <link rel="stylesheet" href="/assets/css/base/reset.css">
  <link rel="stylesheet" href="/assets/css/base/typography.css">
  <link rel="stylesheet" href="/assets/css/components/header.css">
  <link rel="stylesheet" href="/assets/css/components/card.css">
  <link rel="stylesheet" href="/assets/css/components/footer.css">
  <link rel="stylesheet" href="/assets/css/components/theme-toggle.css">
  <link rel="stylesheet" href="/assets/css/main.css">
</head>
<body>

  <header class="header">
    <div class="container">
      <a href="/" class="logo">Beas<span>Ty</span></a>

      <button class="hamburger" id="hamburger" data-i18n-aria="nav.openMenu" aria-label="Open menu" aria-expanded="false">
        <span></span>
        <span></span>
        <span></span>
      </button>

      <nav class="navbar" id="navbar">
        <ul>
          <li><a href="/" class="active" data-i18n="nav.projects">Projects</a></li>
          <li><a href="#contact" data-i18n="nav.contact">Contact</a></li>
          <li>
            <button id="theme-toggle" aria-label="Toggle theme">
              <span class="light-icon">&#9728;</span>
              <span class="dark-icon">&#9790;</span>
            </button>
          </li>
          <li class="lang-switcher">
            <button data-lang-btn="en">EN</button>
            <span>|</span>
            <button data-lang-btn="es">ES</button>
          </li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <div class="container">

      <!-- ── Projects ─────────────────────────────────────────── -->
      <section class="section">
        <p class="section-label" data-i18n="home.portfolio">Portfolio</p>
        <h2 class="section-heading" data-i18n="home.projects">Projects</h2>
        <div class="projects-grid" id="projects-grid">
          <!-- Auto-generated from /data/projects.js -->
        </div>
      </section>

      <!-- ── Contact ──────────────────────────────────────────── -->
      <section class="section contact-section" id="contact">
        <p class="section-label" data-i18n="home.contactLabel">Contact</p>
        <h2 class="section-heading" data-i18n="home.contactHeading">Contact Me</h2>
        <div class="contact-links">
          <a href="#" class="contact-link">
            <span class="contact-icon">&#9993;</span>
            <span>Email</span>
          </a>
          <a href="#" class="contact-link">
            <span class="contact-icon">in</span>
            <span>LinkedIn</span>
          </a>
          <a href="#" class="contact-link">
            <span class="contact-icon">&#9679;</span>
            <span>GitHub</span>
          </a>
          <a href="#" class="contact-link">
            <span class="contact-icon">&#9654;</span>
            <span>Unity Asset Store</span>
          </a>
        </div>
      </section>

    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <span class="footer-copy">&#169; 2026 Álvaro Bautista &mdash; bauflow</span>
      <nav class="footer-links">
        <a href="#contact" data-i18n="footer.contact">Contact</a>
        <a href="/" data-i18n="footer.projects">Projects</a>
      </nav>
    </div>
  </footer>

  <script src="/data/translations/en/shared.js"></script>
  <script src="/data/translations/es/shared.js"></script>
  <script src="/data/translations.js"></script>
  <script src="/assets/js/i18n.js"></script>
  <script src="/data/projects.js"></script>
  <script src="/assets/js/projects-loader.js"></script>
  <script src="/assets/js/theme-toggle.js"></script>
  <script>
    (function () {
      var btn    = document.getElementById('hamburger');
      var navbar = document.getElementById('navbar');
      if (!btn || !navbar) return;

      btn.addEventListener('click', function () {
        var open = navbar.classList.toggle('open');
        btn.classList.toggle('open', open);
        btn.setAttribute('aria-expanded', open);
      });

      document.addEventListener('click', function (e) {
        if (!btn.contains(e.target) && !navbar.contains(e.target)) {
          navbar.classList.remove('open');
          btn.classList.remove('open');
          btn.setAttribute('aria-expanded', 'false');
        }
      });
    })();
  </script>
</body>
</html>
